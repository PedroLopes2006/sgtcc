# Infraestrutura do backend como código. No Render: Blueprints > New Blueprint
# Instance, apontando para o repositório.
#
# O banco NÃO está declarado aqui de propósito: o Postgres grátis do Render
# expira 30 dias depois de criado. Use o Supabase e cole a connection string
# em DATABASE_URL.
services:
  - type: web
    name: sgtcc-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # O Render pede estes valores UMA VEZ, ao criar o Blueprint. Depois
      # disso, mudanças são feitas na aba Environment do serviço.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Conta do /admin: o plano grátis não tem shell, então o build.sh a cria.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
